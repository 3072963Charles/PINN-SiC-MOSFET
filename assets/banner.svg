  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
    <text x="72" y="116" font-size="50" font-weight="700" fill="#ffffff">PINN 驱动的 <tspan fill="#7dd3fc">SiC MOSFET</tspan> SPICE 参数提取</text>
    <text x="74" y="158" font-size="22" fill="#bae6fd" opacity="0.92">Physics-Informed Neural Networks × Silvaco TCAD × SPICE Level-3</text>
